x-env: &env
  DATABASE_URI: "mariadb+pymysql://bunkerweb:secret@bw-db:3306/db"
  LOG_LEVEL: "info"
  # Ship each component's own logs to the syslog-ng collector so they show up
  # in the UI Logs page (which reads /var/log/bunkerweb/*.log).
  LOG_TYPES: "stderr syslog"
  LOG_SYSLOG_ADDRESS: "udp://bw-syslog:514"

services:
  bunkerweb:
    image: bunkerity/bunkerweb:1.6.12
    ports:
      # bound to 127.0.0.1: reachable only from this machine, never from LAN/internet
      - 127.0.0.1:8080:8080/tcp
      - 127.0.0.1:8443:8443/tcp
    environment:
      API_WHITELIST_IP: "127.0.0.0/24 10.20.30.0/24"
    restart: "unless-stopped"
    networks:
      bw-universe:
        aliases:
          - bunkerweb
      bw-services:
        aliases:
          - bunkerweb

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.6.12
    depends_on:
      - bunkerweb
      - bw-db
      - bw-redis
    volumes:
      - bw-storage:/data
      - ../threatmap:/data/plugins/threatmap:ro
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: "bunkerweb"
      SERVER_NAME: "www.example.com app1.example.com"
      MULTISITE: "yes"
      API_WHITELIST_IP: "127.0.0.0/24 10.20.30.0/24"
      # Persist blocked-request reports so history survives instance reloads
      # and the 7-day threat-map window is meaningful.
      USE_REDIS: "yes"
      REDIS_HOST: "bw-redis"
      # Route the instance access/error logs to syslog-ng -> UI Logs page.
      ACCESS_LOG_1: "syslog:server=bw-syslog:514,tag=bunkerweb_access"
      ERROR_LOG_1: "syslog:server=bw-syslog:514,tag=bunkerweb"
      USE_BUNKERNET: "no"
      USE_BLACKLIST: "no"
      SEND_ANONYMOUS_REPORT: "no"
      DISABLE_DEFAULT_SERVER: "yes"
      SESSIONS_CHECK_IP: "no"
      # Trust X-Forwarded-For so attacks from arbitrary countries can be simulated (test only!)
      USE_REAL_IP: "yes"
      REAL_IP_FROM: "0.0.0.0/0"
      REAL_IP_HEADER: "X-Forwarded-For"
      www.example.com_USE_TEMPLATE: "ui"
      www.example.com_GENERATE_SELF_SIGNED_SSL: "yes"
      www.example.com_USE_REVERSE_PROXY: "yes"
      www.example.com_REVERSE_PROXY_URL: "/admin"
      www.example.com_REVERSE_PROXY_HOST: "http://bw-ui:7000"
      app1.example.com_USE_REVERSE_PROXY: "yes"
      app1.example.com_REVERSE_PROXY_URL: "/"
      app1.example.com_REVERSE_PROXY_HOST: "http://app1:8080"
    restart: "unless-stopped"
    networks:
      bw-universe:
        aliases:
          - bw-scheduler
      bw-db:
        aliases:
          - bw-scheduler

  bw-ui:
    image: bunkerity/bunkerweb-ui:1.6.12
    ports:
      # bound to 127.0.0.1: reachable only from this machine, never from LAN/internet
      - 127.0.0.1:7000:7000
    volumes:
      # Read the collected .log files rendered by the UI Logs page.
      - bw-logs:/var/log/bunkerweb
    environment:
      <<: *env
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "P@ssw0rd"
      CHECK_PRIVATE_IP: "no"
      FLASK_SECRET: "secret"
      MAX_WORKERS: "1"
      MAX_THREADS: "4"
    restart: "unless-stopped"
    networks:
      bw-universe:
        aliases:
          - bw-ui
      bw-db:
        aliases:
          - bw-ui

  bw-db:
    image: mariadb:11
    command: --max-allowed-packet=67108864
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "db"
      MYSQL_USER: "bunkerweb"
      MYSQL_PASSWORD: "secret"
    volumes:
      - bw-data:/var/lib/mysql
    restart: "unless-stopped"
    networks:
      bw-db:
        aliases:
          - bw-db

  bw-redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - bw-redis-data:/data
    restart: "unless-stopped"
    networks:
      bw-universe:
        aliases:
          - bw-redis

  bw-syslog:
    image: balabit/syslog-ng:4.10.2
    cap_add:
      - NET_BIND_SERVICE
      - NET_BROADCAST
      - NET_RAW
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - CHOWN
      - SYSLOG
    volumes:
      - bw-logs:/var/log/bunkerweb
      - ./syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf
    restart: "unless-stopped"
    networks:
      bw-universe:
        aliases:
          - bw-syslog

  app1:
    image: bunkerity/bunkerweb-hello:v1.0
    restart: "unless-stopped"
    networks:
      bw-services:
        aliases:
          - app1

volumes:
  bw-data:
  bw-storage:
  bw-redis-data:
  bw-logs:

networks:
  bw-universe:
    name: bw-universe
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
  bw-services:
    name: bw-services
  bw-db:
    name: bw-db
